<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Sign in · Atlas</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="lumi6-mark.png">
  <link rel="apple-touch-icon" href="lumi6-mark.png">
  <link rel="stylesheet" href="css/login.css?v=20260919h">
  <script src="/api/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/auth/supabase-auth.js"></script>
</head>
<body class="join-page">
  <main class="login-shell">
    <section class="login-card join-card" aria-labelledby="loginTitle">
      <header class="login-card-header">
        <img src="lumi6-mark.png" alt="">
        <h1 id="loginTitle">Atlas</h1>
        <p>Sign in to continue</p>
      </header>
      <form id="authLoginForm" class="login-form">
        <label class="login-field" for="loginEmail">
          <span>Email</span>
          <input id="loginEmail" name="email" type="email" required placeholder="name@email.com" autocomplete="email">
        </label>
        <label class="login-field" for="loginPassword">
          <span>Password</span>
          <input id="loginPassword" name="password" type="password" required placeholder="Required" autocomplete="current-password">
        </label>
        <button class="login-submit" type="submit">Continue</button>
      </form>
      <div id="authNotice" class="login-notice" hidden role="status"></div>
    </section>
  </main>
</body>
</html>
